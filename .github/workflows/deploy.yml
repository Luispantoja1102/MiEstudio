name: Deploy al VPS

# Publica en el VPS cuando el CI de main termina en verde. El correo de resultado (éxito o fallo)
# lo manda el propio VPS (scripts/notify-deploy.sh vía curl/SMTP), no la acción de GitHub: así el
# envío sale desde la IP del servidor. Las credenciales de correo están en los secrets del
# repositorio y Actions se las pasa al VPS por SSH en cada corrida (no se guardan en el servidor).
# Secretos del repositorio: VPS_SSH_KEY, VPS_KNOWN_HOSTS, VPS_HOST (usuario@servidor), PROD_URL (https://tu-dominio),
# MAIL_USERNAME, MAIL_PASSWORD (contraseña de aplicación de Gmail).
# Opcionales: VPS_PATH (carpeta en el servidor, por defecto ~/barbella), VPS_DEPLOY_CMD (por defecto: docker compose up -d --build), MAIL_TO, MAIL_SERVER.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # Si el CI falló no se publica nada: el correo lo reporta como fallo.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOST: ${{ secrets.VPS_HOST }}
      VPS_PATH: ${{ secrets.VPS_PATH || '~/barbella' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Llave SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Los .env viven solo en el servidor: no se tocan. No se borra nada que el servidor tenga y el repositorio no.
      - name: Subir código
        run: rsync -az --exclude .env --exclude '.env.*' --exclude .git --exclude node_modules --exclude .claude ./ "$HOST:$VPS_PATH/"

      - name: Reconstruir y arrancar
        env:
          DEPLOY_CMD: ${{ secrets.VPS_DEPLOY_CMD || 'docker compose up -d --build' }}
        run: ssh "$HOST" "cd $VPS_PATH && $DEPLOY_CMD && docker image prune -f && docker builder prune -f --filter until=24h"

      # /health responde 200 solo si la API está viva y puede hablar con la base de datos.
      - name: Comprobar que responde
        id: health
        env:
          PROD_URL: ${{ secrets.PROD_URL }}
        run: |
          for i in $(seq 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${PROD_URL%/}/health")
            [ "$code" = 200 ] && exit 0
            sleep 5
          done
          echo "/health respondió $code"; exit 1

      # El VPS manda el correo de estado (scripts/notify-deploy.sh), con sus propias credenciales
      # de .env. if: always() para que avise también cuando el paso anterior falló.
      - name: Avisar el resultado por correo (desde el VPS)
        if: always()
        continue-on-error: true
        env:
          RESULT: ${{ steps.health.outcome == 'success' && 'success' || 'failure' }}
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message || github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.workflow_run.head_commit.author.name || github.actor }}
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          ssh "$HOST" "cd $VPS_PATH && MAIL_USERNAME='$MAIL_USERNAME' MAIL_PASSWORD='$MAIL_PASSWORD' bash scripts/notify-deploy.sh '$RESULT' '$COMMIT_MESSAGE' '$SHA' '$COMMIT_AUTHOR' '$BRANCH' '$COMMIT_URL' '$RUN_URL'"

  # Si el CI falló, el job deploy ni corre: avisa igual, usando el código ya publicado en el VPS
  # (el de la última vez que sí se desplegó) solo para mandar el correo.
  notify-ci-failed:
    name: Avisar que el CI falló (desde el VPS)
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      HOST: ${{ secrets.VPS_HOST }}
      VPS_PATH: ${{ secrets.VPS_PATH || '~/barbella' }}
    steps:
      - name: Llave SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Avisar
        env:
          COMMIT_MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.workflow_run.head_commit.author.name }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        run: |
          ssh "$HOST" "cd $VPS_PATH && MAIL_USERNAME='$MAIL_USERNAME' MAIL_PASSWORD='$MAIL_PASSWORD' bash scripts/notify-deploy.sh 'failure' '$COMMIT_MESSAGE' '$SHA' '$COMMIT_AUTHOR' '$BRANCH' '$COMMIT_URL' '$RUN_URL'"
